<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>陈松涛 · 个人平台</title>
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; background: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #1a1a1a; -webkit-font-smoothing: antialiased; }

  .app { max-width: 680px; margin: 0 auto; padding: 48px 20px 40px; }

  /* 顶部头像 + 标题区 */
  .header { text-align: center; margin-bottom: 40px; }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: #1a1a1a; color: #fff;
    margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 600;
    letter-spacing: 1px;
  }
  .title { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; letter-spacing: 0.5px; }
  .subtitle { font-size: 13px; color: #999; letter-spacing: 0.3px; }

  /* 卡片容器 */
  .cards { display: flex; flex-direction: column; gap: 14px; }
  .card {
    display: flex; align-items: center; gap: 14px;
    padding: 20px;
    background: #fff;
    border: 1px solid #f0f0f0;
    border-radius: 16px;
    text-decoration: none;
    color: #1a1a1a;
    transition: all .2s ease;
    cursor: pointer;
  }
  .card:hover {
    border-color: #d8d8d8;
    background: #fcfcfc;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.04);
  }
  .card:active { transform: scale(0.99); background: #f5f5f5; }

  /* 卡片图标 */
  .card-icon {
    flex-shrink: 0;
    width: 48px; height: 48px;
    border-radius: 12px;
    background: #f5f5f5;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .card-icon.icon-diary { background: #f0f0f0; }
  .card-icon.icon-rag { background: #f0f0f0; }

  /* 卡片文案区 */
  .card-body { flex: 1; min-width: 0; }
  .card-title {
    font-size: 15px; font-weight: 600; color: #1a1a1a;
    margin-bottom: 4px;
    letter-spacing: 0.3px;
  }
  .card-desc {
    font-size: 13px; color: #999;
    line-height: 1.5;
    overflow: hidden;
  }

  /* 卡片箭头 */
  .card-arrow {
    flex-shrink: 0;
    color: #ccc;
    font-size: 14px;
    transition: color .2s, transform .2s;
  }
  .card:hover .card-arrow { color: #1a1a1a; transform: translateX(2px); }

  /* 分割线 */
  .divider { height: 1px; background: #f0f0f0; margin: 32px 0 20px; }

  /* 底部信息 */
  .footer {
    text-align: center;
    font-size: 12px;
    color: #bbb;
    letter-spacing: 0.3px;
    margin-top: 40px;
    line-height: 1.6;
  }
  .footer .footer-name { color: #999; font-weight: 500; }

  /* 标签 */
  .tag {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 8px;
    font-size: 11px;
    color: #666;
    background: #f5f5f5;
    border-radius: 6px;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="app">
    <!-- 头部 -->
    <div class="header">
      <div class="avatar">陈</div>
      <div class="title">陈松涛 · 个人平台</div>
      <div class="subtitle">Java 后端开发工程师 · 27 届</div>
    </div>

    <!-- 卡片列表 -->
    <div class="cards">
      <a class="card" href="http://152.136.114.225:8088/">
        <div class="card-icon icon-diary">📝</div>
        <div class="card-body">
          <div class="card-title">个人简记</div>
          <div class="card-desc">飞书生态个人效率平台 · 消费记账 / 共享日记 / 待办</div>
          <span class="tag">飞书生态</span>
        </div>
        <div class="card-arrow">›</div>
      </a>

      <a class="card" href="http://152.136.114.225:8082/">
        <div class="card-icon icon-rag">🤖</div>
        <div class="card-body">
          <div class="card-title">个人知识库</div>
          <div class="card-desc">RAG 检索增强问答 · 项目经历 / 技术笔记 / 智能问答</div>
          <span class="tag">AI 工程</span>
        </div>
        <div class="card-arrow">›</div>
      </a>
    </div>

    <!-- 底部 -->
    <div class="footer">
      <div class="footer-name">陈松涛</div>
      <div>河北工程大学 · 27 届</div>
    </div>
  </div>
</body>
</html>
