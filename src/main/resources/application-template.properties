server.port=8088

# ===== 飞书自定义机器人 webhook =====
# 在飞书群 -> 设置 -> 群机器人 -> 添加自定义机器人，获取 webhook 地址
feishu.bot.webhook=https://open.feishu.cn/open-apis/bot/v2/hook/你的webhook地址

# ===== 飞书开放平台自建应用（用于多维表格 API） =====
# 在 https://open.feishu.cn 开发者后台创建自建应用后获取
feishu.app.id=你的app_id
feishu.app.secret=你的app_secret
# 多维表格的 app_token（URL 里 /base/ 后面那段）
feishu.bitable.app-token=你的app_token
# 数据表的 table_id（从 API 获取，不是 URL 里的 table= 参数）
feishu.bitable.table-id=你的table_id

# 字符集
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.messages.encoding=UTF-8

# ===== MySQL 数据库配置 =====
spring.datasource.url=jdbc:mysql://localhost:3306/feishu_book?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=你的数据库密码
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis-Plus 配置 =====
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.table-prefix=t_

# ===== RabbitMQ 配置 =====
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# ===== 消费者配置：手动确认 + 自动重试 =====
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ===== AI 大模型配置（Qwen / 阿里云百炼） =====
# API Key 在 https://bailian.console.aliyun.com/ 申请
ai.qwen.api-key=你的API Key
ai.qwen.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
ai.qwen.model=qwen-turbo
ai.qwen.timeout=15000
ai.qwen.temperature=0.1

# ===== Redis 配置（存 JWT token） =====
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=5000ms

# ===== JWT 配置 =====
jwt.secret=your-jwt-secret-at-least-32-characters-long-please-change
jwt.expire-days=7
