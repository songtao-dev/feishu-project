<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>记账助手</title>
<link rel="stylesheet" href="https://unpkg.com/vant@4/lib/index.css" />
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #1a1a1a; -webkit-font-smoothing: antialiased; }
  #app { max-width: 680px; margin: 0 auto; padding-bottom: 80px; }
  .nav { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: center; padding: 12px 0; }
  .nav-tab { font-size: 14px; color: #999; cursor: pointer; padding: 6px 16px; border-radius: 8px; transition: all .2s; }
  .nav-tab.active { color: #1a1a1a; background: #f5f5f5; }
  .content { padding: 16px 20px 0; }
  .label { font-size: 13px; font-weight: 500; color: #666; margin-bottom: 8px; }
  .label .hint { font-weight: 400; color: #bbb; font-size: 12px; }
  .input-box { width: 100%; border: 1px solid #e8e8e8; border-radius: 12px; padding: 14px; font-size: 14px; line-height: 1.6; box-sizing: border-box; background: #fafafa; transition: border-color .2s, background .2s; outline: none; resize: none; font-family: inherit; }
  .input-box:focus { border-color: #d0d0d0; background: #fff; }
  .input-box::placeholder { color: #ccc; }
  textarea.input-box { min-height: 120px; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-item .input-box { padding: 10px 12px; }
  @media (max-width: 380px) { .field-grid { grid-template-columns: 1fr; } }
  .btn { border: none; border-radius: 10px; padding: 10px 20px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: #1a1a1a; color: #fff; }
  .btn-primary:active { background: #333; transform: scale(.98); }
  .btn-ghost { background: transparent; color: #666; border: 1px solid #e8e8e8; }
  .btn-ghost:active { background: #f5f5f5; }
  .btn-text { background: transparent; color: #999; padding: 6px 10px; font-size: 13px; border: none; }
  .btn-block { width: 100%; justify-content: center; padding: 14px; font-size: 15px; }
  .btn:disabled { opacity: .5; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .tip { margin-top: 12px; padding: 10px 14px; background: #f9f9f9; border-radius: 10px; font-size: 13px; color: #888; line-height: 1.5; }
  .divider { height: 1px; background: #f0f0f0; margin: 24px 0; }
  .record-item { padding: 16px 0; border-bottom: 1px solid #f5f5f5; }
  .record-item:last-child { border-bottom: none; }
  .record-row { display: flex; align-items: baseline; gap: 8px; }
  .record-num { font-size: 13px; color: #ccc; font-weight: 600; min-width: 28px; }
  .record-merchant { font-size: 15px; font-weight: 500; color: #1a1a1a; flex: 1; }
  .record-amount { font-size: 16px; font-weight: 600; }
  .record-amount.expense { color: #1a1a1a; }
  .record-amount.income { color: #2d8659; }
  .record-meta { font-size: 13px; color: #999; margin-top: 4px; padding-left: 36px; }
  .record-tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; }
  .tag-expense { background: #f0f0f0; color: #666; }
  .tag-income { background: #e8f5e9; color: #2d8659; }
  .record-actions { margin-top: 8px; padding-left: 36px; display: flex; gap: 8px; }
  .btn-delete { background: transparent; color: #e53935; border: 1px solid #ffcdd2; border-radius: 6px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .btn-delete:active { background: #ffebee; }
  .btn-edit { background: transparent; color: #666; border: 1px solid #e8e8e8; border-radius: 6px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
  .btn-edit:active { background: #f5f5f5; }
  .edit-panel { margin-top: 10px; padding: 14px; background: #fafafa; border-radius: 12px; }
  .edit-panel .field-grid { margin-bottom: 10px; }
  .edit-panel .input-box { padding: 8px 10px; font-size: 13px; }
  .ai-section { background: #fafafa; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
  .ai-input-row { display: flex; gap: 8px; align-items: flex-end; }
  .ai-input-row .input-box { flex: 1; min-height: 44px; max-height: 100px; }
  .ai-reply { margin-top: 12px; padding: 12px 14px 12px 16px; background: #fff; border-radius: 12px; font-size: 14px; color: #333; line-height: 1.6; border: 1px solid #f0f0f0; border-left: 3px solid #1a1a1a; }
  .ai-reply.success { border-left-color: #2d8659; }
  .ai-reply.error { border-left-color: #e53935; color: #c62828; }
  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid #f0f0f0; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); box-sizing: border-box; z-index: 100; max-width: 680px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .bottom-bar .status { flex: 1; font-size: 12px; color: #aaa; line-height: 1.4; }
  .empty { text-align: center; padding: 60px 0; color: #ccc; font-size: 14px; }
  .preview-item { padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
  .preview-item:last-child { border-bottom: none; }
  .preview-row { display: flex; align-items: center; gap: 8px; }
  .preview-idx { font-size: 12px; color: #ccc; width: 24px; }
  .preview-title { flex: 1; font-size: 14px; color: #333; }
  .preview-amount { font-size: 14px; font-weight: 500; color: #1a1a1a; }
  /* 统计页面 */
  .stats-range { display: flex; gap: 8px; margin-bottom: 16px; }
  .range-btn { padding: 8px 20px; border-radius: 8px; font-size: 14px; border: 1px solid #e8e8e8; background: transparent; color: #666; cursor: pointer; transition: all .2s; }
  .range-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .stat-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  @media (max-width: 380px) { .stat-cards { grid-template-columns: 1fr; } }
  .stat-card { padding: 16px; background: #fafafa; border-radius: 12px; }
  .stat-card .stat-label { font-size: 12px; color: #999; margin-bottom: 4px; }
  .stat-card .stat-value { font-size: 22px; font-weight: 700; color: #1a1a1a; }
  .stat-card .stat-value.income { color: #2d8659; }
  .stat-card .stat-value.expense { color: #1a1a1a; }
  .stat-card .stat-value.net { color: #e53935; }
  .chart-section { margin-bottom: 24px; }
  .chart-title { font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 12px; }
  .chart-box { width: 100%; height: 300px; }
  .compare-summary { display: flex; gap: 16px; margin-bottom: 12px; }
  .compare-item { flex: 1; text-align: center; }
  .compare-item .compare-label { font-size: 12px; color: #999; margin-bottom: 4px; }
  .compare-item .compare-value { font-size: 18px; font-weight: 600; }
  .compare-change { font-size: 12px; margin-top: 2px; }
  .compare-change.up { color: #e53935; }
  .compare-change.down { color: #2d8659; }
  /* 登录页 */
  .login-wrap { max-width: 680px; margin: 0 auto; padding: 60px 24px 40px; }
  .login-logo { text-align: center; font-size: 28px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
  .login-subtitle { text-align: center; font-size: 14px; color: #999; margin-bottom: 36px; }
  .login-card { background: #fafafa; border-radius: 16px; padding: 24px 20px; }
  .login-card .input-box { background: #fff; }
  .login-card .field-item { margin-bottom: 14px; }
  .login-card .btn-block { margin-top: 8px; }
  .login-tip { margin-top: 20px; padding: 12px 14px; background: #fff8e1; border-radius: 10px; font-size: 12px; color: #8d6e63; line-height: 1.6; }
  /* 导航栏用户区 */
  .nav-user { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 12px; color: #999; display: flex; align-items: center; gap: 8px; }
  .nav-user .logout-link { color: #1a1a1a; cursor: pointer; }
  /* sms_key 提示 */
  .sms-tip { margin-bottom: 12px; padding: 10px 14px; background: #e3f2fd; border-radius: 10px; font-size: 12px; color: #1565c0; line-height: 1.5; word-break: break-all; }
  .sms-tip .sms-copy { color: #1a1a1a; font-weight: 600; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div id="app">
  <!-- ===== 登录页 ===== -->
  <div v-if="!isLoggedIn" class="login-wrap">
    <div class="login-logo">记账助手</div>
    <div class="login-subtitle">请登录后使用</div>
    <div class="login-card">
      <div class="field-item"><div class="label">用户名</div><input v-model="loginForm.username" class="input-box" placeholder="请输入用户名" /></div>
      <div class="field-item"><div class="label">密码</div><input v-model="loginForm.password" class="input-box" type="password" placeholder="请输入密码" @keyup.enter="doLogin" /></div>
      <button class="btn btn-primary btn-block" @click="doLogin" :disabled="loginLoading">{{ loginLoading ? '登录中...' : '登录' }}</button>
    </div>
    <div class="login-tip">账号由管理员创建，如需账号请联系管理员。<br />SmsForwarder 用户请在 webhook URL 末尾加上 ?token=你的短信密钥</div>
  </div>

  <!-- ===== 主应用 ===== -->
  <template v-if="isLoggedIn">
  <div class="nav">
    <div :class="['nav-tab', mode==='single' && 'active']" @click="mode='single'">记账</div>
    <div :class="['nav-tab', mode==='batch' && 'active']" @click="mode='batch'">批量</div>
    <div :class="['nav-tab', mode==='records' && 'active']" @click="switchRecords">记录</div>
    <div :class="['nav-tab', mode==='stats' && 'active']" @click="switchStats">统计</div>
    <div class="nav-user">
      <span>{{ userInfo?.nickname || userInfo?.username }}</span>
      <span class="logout-link" @click="logout">退出</span>
    </div>
  </div>

  <div class="content">
    <!-- 单条模式 -->
    <template v-if="mode==='single'">
      <div style="margin-bottom: 20px;">
        <div class="label">消息内容 <span class="hint">粘贴短信或输入消费描述</span></div>
        <textarea v-model="form.rawMessage" class="input-box" rows="5" placeholder="例：尾号1234卡8月1日19:48支出(消费xx支付-xx餐饮)0.01元，余额0.01元。【xx银行】"></textarea>
        <div class="btn-row">
          <button class="btn btn-ghost" @click="doParse" :disabled="parsing">解析</button>
          <button class="btn btn-ghost" @click="doAiParse" :disabled="aiParsing">AI 解析</button>
          <button class="btn btn-text" @click="fillSample">样例</button>
        </div>
        <div v-if="parseTip" class="tip">{{ parseTip }}</div>
      </div>
      <div class="divider"></div>
      <div style="margin-bottom: 16px;">
        <div class="label">详细信息 <span class="hint">解析后自动填充，可手动修改</span></div>
        <div class="field-grid">
          <div class="field-item"><div class="label" style="font-size:12px; margin-bottom:4px;">银行</div><input v-model="form.bank" class="input-box" placeholder="xx银行" /></div>
          <div class="field-item"><div class="label" style="font-size:12px; margin-bottom:4px;">尾号</div><input v-model="form.cardTail" class="input-box" placeholder="1234" /></div>
        </div>
        <div style="margin-top:12px;"><div class="label" style="font-size:12px; margin-bottom:4px;">时间</div><input v-model="form.happenTime" class="input-box" placeholder="2026-08-01 19:48" /></div>
        <div class="field-grid" style="margin-top:12px;">
          <div class="field-item"><div class="label" style="font-size:12px; margin-bottom:4px;">收支</div><input v-model="form.direction" class="input-box" placeholder="支出" /></div>
          <div class="field-item"><div class="label" style="font-size:12px; margin-bottom:4px;">渠道</div><input v-model="form.channel" class="input-box" placeholder="xx支付" /></div>
        </div>
        <div style="margin-top:12px;"><div class="label" style="font-size:12px; margin-bottom:4px;">商家</div><input v-model="form.merchant" class="input-box" placeholder="xx餐饮" /></div>
        <div class="field-grid" style="margin-top:12px;">
          <div class="field-item"><div class="label" style="font-size:12px; margin-bottom:4px;">金额(元)</div><input v-model="form.amount" class="input-box" placeholder="0.01" type="number" /></div>
          <div class="field-item"><div class="label" style="font-size:12px; margin-bottom:4px;">余额(元)</div><input v-model="form.balance" class="input-box" placeholder="0.01" type="number" /></div>
        </div>
      </div>
    </template>

    <!-- 批量模式 -->
    <template v-if="mode==='batch'">
      <div style="margin-bottom: 20px;">
        <div class="label">批量输入 <span class="hint">每行一条短信</span></div>
        <textarea v-model="batchText" class="input-box" rows="10" placeholder="每行粘贴一条银行短信"></textarea>
        <div class="btn-row">
          <button class="btn btn-ghost" @click="doBatchParse" :disabled="batchParsing">预览解析</button>
          <button class="btn btn-ghost" @click="fillBatchSample">样例</button>
        </div>
      </div>
      <div v-if="batchPreview.length > 0">
        <div class="divider"></div>
        <div class="label">解析预览（{{ batchPreview.length }} 条）</div>
        <div v-for="(item, idx) in batchPreview" :key="idx" class="preview-item">
          <div class="preview-row"><span class="preview-idx">{{ idx + 1 }}</span><span class="preview-title">{{ item.bank || '未知' }} · {{ item.merchant || '—' }}</span><span class="preview-amount">¥{{ item.amount || '?' }}</span></div>
        </div>
      </div>
    </template>

    <!-- 记录模式 -->
    <template v-if="mode==='records'">
      <div v-if="smsKey" class="sms-tip">
        短信转发密钥：<span class="sms-copy" @click="copySmsKey">{{ smsKey }}</span><br />
        SmsForwarder webhook URL 末尾加 ?token={{ smsKey }}
      </div>
      <div class="ai-section">
        <div class="label" style="margin-bottom:10px;">助手</div>
        <div class="ai-input-row">
          <textarea v-model="aiCommandInput" class="input-box" rows="1" placeholder="删除#3 / 更新#2金额为20"></textarea>
          <button class="btn btn-primary" @click="doAiCommand" :disabled="aiCommanding" style="white-space:nowrap;">执行</button>
        </div>
        <div v-if="aiReply" :class="['ai-reply', aiReplyError ? 'error' : 'success']">{{ aiReply }}</div>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
        <div class="label" style="margin:0;">消费记录</div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-ghost" @click="doAiQuery" :disabled="aiCommanding" style="padding:6px 14px; font-size:13px;">查询</button>
          <button class="btn btn-text" @click="loadRecords" :disabled="recordsLoading">刷新</button>
        </div>
      </div>
      <div v-if="records.length === 0 && !recordsLoading" class="empty">暂无记录</div>
      <div v-for="r in records" :key="r.id" class="record-item">
        <div class="record-row">
          <span class="record-num">#{{ r.sortNum || r.id }}</span>
          <span :class="['record-tag', r.direction === '收入' ? 'tag-income' : 'tag-expense']">{{ r.direction || '支出' }}</span>
          <span class="record-merchant">{{ r.merchant || '未知' }}</span>
          <span :class="['record-amount', r.direction === '收入' ? 'income' : 'expense']">{{ r.direction === '收入' ? '+' : '-' }}¥{{ r.amount || '0' }}</span>
        </div>
        <div class="record-meta">
          <span v-if="r.bank">{{ r.bank }}</span><span v-if="r.cardTail"> · 尾号{{ r.cardTail }}</span><span v-if="r.channel"> · {{ r.channel }}</span><span v-if="r.happenTime"> · {{ r.happenTime }}</span><span v-if="r.balance != null"> · 余额¥{{ r.balance }}</span>
        </div>
        <div class="record-actions">
          <button class="btn-edit" @click="toggleEdit(r.id)">编辑</button>
          <button class="btn-delete" @click="deleteRecord(r.id, r.merchant)">删除</button>
        </div>
        <div v-if="editingId === r.id" class="edit-panel">
          <div class="field-grid">
            <div class="field-item"><div class="label" style="font-size:12px; margin-bottom:4px;">商家</div><input v-model="editForm.merchant" class="input-box" /></div>
            <div class="field-item"><div class="label" style="font-size:12px; margin-bottom:4px;">金额</div><input v-model="editForm.amount" class="input-box" type="number" /></div>
          </div>
          <div class="field-grid">
            <div class="field-item"><div class="label" style="font-size:12px; margin-bottom:4px;">收支</div><input v-model="editForm.direction" class="input-box" /></div>
            <div class="field-item"><div class="label" style="font-size:12px; margin-bottom:4px;">渠道</div><input v-model="editForm.channel" class="input-box" /></div>
          </div>
          <div class="field-grid">
            <div class="field-item"><div class="label" style="font-size:12px; margin-bottom:4px;">银行</div><input v-model="editForm.bank" class="input-box" /></div>
            <div class="field-item"><div class="label" style="font-size:12px; margin-bottom:4px;">余额</div><input v-model="editForm.balance" class="input-box" type="number" /></div>
          </div>
          <div style="margin-top:10px; display:flex; gap:8px;">
            <button class="btn btn-primary" style="padding:8px 16px; font-size:13px;" @click="saveEdit(r.id)">保存</button>
            <button class="btn btn-ghost" style="padding:8px 16px; font-size:13px;" @click="editingId = null">取消</button>
          </div>
        </div>
      </div>
    </template>

    <!-- 统计模式 -->
    <template v-if="mode==='stats'">
      <div class="stats-range">
        <button :class="['range-btn', statsRange==='week' && 'active']" @click="switchStatsRange('week')">本周</button>
        <button :class="['range-btn', statsRange==='month' && 'active']" @click="switchStatsRange('month')">本月</button>
      </div>

      <!-- 汇总卡片 -->
      <div class="stat-cards" v-if="statsSummary">
        <div class="stat-card"><div class="stat-label">总支出</div><div class="stat-value expense">¥{{ fmt(statsSummary.totalExpense) }}</div></div>
        <div class="stat-card"><div class="stat-label">总收入</div><div class="stat-value income">¥{{ fmt(statsSummary.totalIncome) }}</div></div>
        <div class="stat-card"><div class="stat-label">净额</div><div class="stat-value net">¥{{ fmt(statsSummary.netAmount) }}</div></div>
        <div class="stat-card"><div class="stat-label">笔数 / 日均</div><div class="stat-value">{{ statsSummary.expenseCount }} / ¥{{ fmt(statsSummary.avgDaily) }}</div></div>
      </div>

      <!-- 消费趋势折线图 -->
      <div class="chart-section">
        <div class="chart-title">消费趋势</div>
        <div id="chart-trend" class="chart-box"></div>
      </div>

      <!-- 分类占比饼图 -->
      <div class="chart-section">
        <div class="chart-title">分类占比</div>
        <div id="chart-category" class="chart-box"></div>
      </div>

      <!-- 对比柱状图 -->
      <div class="chart-section" v-if="statsCompare">
        <div class="chart-title">{{ statsCompare.currentLabel }} vs {{ statsCompare.previousLabel }}</div>
        <div class="compare-summary">
          <div class="compare-item">
            <div class="compare-label">本期支出</div>
            <div class="compare-value">¥{{ fmt(statsCompare.current.expense) }}</div>
            <div :class="['compare-change', isUp(statsCompare.expenseChange) ? 'up' : 'down']">{{ statsCompare.expenseChange }}</div>
          </div>
          <div class="compare-item">
            <div class="compare-label">上期支出</div>
            <div class="compare-value">¥{{ fmt(statsCompare.previous.expense) }}</div>
            <div class="compare-change">{{ statsCompare.previous.count }} 笔</div>
          </div>
        </div>
        <div id="chart-compare" class="chart-box"></div>
      </div>

      <div v-if="!statsSummary" class="empty">加载中...</div>
    </template>
  </div>

  <!-- 底部发送栏 -->
  <div class="bottom-bar" v-if="mode === 'single' || mode === 'batch'">
    <div class="status" v-if="lastStatus">{{ lastStatus }}</div>
    <button v-if="mode==='single'" class="btn btn-ghost" @click="resetAll">重置</button>
    <button v-if="mode==='single'" class="btn btn-primary btn-block" style="flex:1;" @click="doSend" :disabled="sending">发送</button>
    <button v-if="mode==='batch'" class="btn btn-ghost" @click="resetBatch">重置</button>
    <button v-if="mode==='batch'" class="btn btn-primary btn-block" style="flex:1;" @click="doBatchSend" :disabled="batchSending">批量发送</button>
  </div>
  </template>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/vant@4/lib/vant.min.js"></script>
<script src="https://unpkg.com/echarts@5/dist/echarts.min.js"></script>
<script>
  const { createApp, reactive, ref, nextTick, watch, onMounted } = Vue;
  const app = createApp({
    setup() {
      // ===== 登录态管理 =====
      const token = ref(localStorage.getItem('token') || '');
      const userInfo = ref(JSON.parse(localStorage.getItem('userInfo') || 'null'));
      const isLoggedIn = ref(!!token.value);
      const loginForm = reactive({ username: '', password: '' });
      const loginLoading = ref(false);
      const smsKey = ref('');

      /** 统一 fetch 封装：自动带 Authorization 头，401 时清空登录态 */
      const apiFetch = async (url, opts = {}) => {
        const headers = { ...(opts.headers || {}) };
        if (token.value) headers['Authorization'] = 'Bearer ' + token.value;
        const resp = await fetch(url, { ...opts, headers });
        if (resp.status === 401) {
          token.value = ''; userInfo.value = null; isLoggedIn.value = false; smsKey.value = '';
          localStorage.removeItem('token'); localStorage.removeItem('userInfo');
          vant.showToast({ type: 'fail', message: '登录已失效，请重新登录' });
          throw new Error('401');
        }
        return resp;
      };

      const doLogin = async () => {
        if (!loginForm.username || !loginForm.password) { vant.showToast('请输入用户名和密码'); return; }
        loginLoading.value = true;
        try {
          const resp = await apiFetch('/api/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json; charset=utf-8' },
            body: JSON.stringify({ username: loginForm.username, password: loginForm.password })
          });
          const data = await resp.json();
          if (data.ok) {
            token.value = data.token;
            userInfo.value = { userId: data.userId, username: data.username, nickname: data.nickname };
            localStorage.setItem('token', data.token);
            localStorage.setItem('userInfo', JSON.stringify(userInfo.value));
            isLoggedIn.value = true;
            loginForm.password = '';
            vant.showToast({ type: 'success', message: '登录成功' });
            loadSmsKey();
          } else {
            vant.showToast({ type: 'fail', message: data.msg || '登录失败' });
          }
        } catch { vant.showToast({ type: 'fail', message: '请求失败' }); }
        finally { loginLoading.value = false; }
      };

      const logout = async () => {
        try { await apiFetch('/api/logout', { method: 'POST' }); } catch {}
        token.value = ''; userInfo.value = null; isLoggedIn.value = false; smsKey.value = '';
        localStorage.removeItem('token'); localStorage.removeItem('userInfo');
      };

      const loadSmsKey = async () => {
        try {
          const resp = await apiFetch('/api/user/info');
          const data = await resp.json();
          if (data.ok) smsKey.value = data.smsKey || '';
        } catch {}
      };

      const copySmsKey = () => {
        if (!smsKey.value) return;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(smsKey.value).then(() => vant.showToast({ type: 'success', message: '已复制' }));
        } else {
          vant.showToast({ type: 'success', message: '请手动复制' });
        }
      };

      // 已登录状态（刷新页面后）自动加载 sms_key
      onMounted(() => { if (isLoggedIn.value) loadSmsKey(); });

      const EMPTY_FORM = () => ({ rawMessage: '', bank: '', cardTail: '', happenTime: '', direction: '', channel: '', merchant: '', amount: null, balance: null });
      const form = reactive(EMPTY_FORM());
      const parsing = ref(false), sending = ref(false), parseTip = ref(''), lastStatus = ref('');
      const mode = ref('single');
      const batchText = ref(''), batchParsing = ref(false), batchSending = ref(false), batchPreview = ref([]);
      const aiParsing = ref(false);
      const records = ref([]), recordsLoading = ref(false);
      const aiCommandInput = ref(''), aiReply = ref(''), aiReplyError = ref(false), aiCommanding = ref(false);
      const editingId = ref(null);
      const editForm = reactive({ merchant: '', amount: '', direction: '', channel: '', bank: '', balance: '' });
      const statsRange = ref('month'), statsSummary = ref(null), statsCompare = ref(null);
      const statsDaily = ref([]), statsCategory = ref([]);
      let trendChart = null, categoryChart = null, compareChart = null;

      const fmt = (v) => { if (v == null) return '0.00'; return Number(v).toFixed(2); };
      const isUp = (s) => s && s.startsWith('+');

      const fillSample = () => { form.rawMessage = '尾号1234卡8月1日00:00支出(消费xx支付-xx餐饮集团有限公司)0.01元，余额0.01元。【xx银行】'; };
      const resetAll = () => { Object.assign(form, EMPTY_FORM()); parseTip.value = ''; lastStatus.value = ''; };
      const fillBatchSample = () => { batchText.value = '尾号1234卡8月1日19:48支出(消费xx支付-xx餐饮集团有限公司)9.89元，余额1247.81元。【工商银行】\n尾号5678卡8月2日10:00支出(消费xx-xx外卖)0.10元，余额0.01元。【xx银行】'; batchPreview.value = []; };
      const resetBatch = () => { batchText.value = ''; batchPreview.value = []; lastStatus.value = ''; };

      const doBatchParse = async () => {
        const lines = batchText.value.split('\n').map(l => l.trim()).filter(l => l);
        if (!lines.length) { vant.showToast('请先输入内容'); return; }
        batchParsing.value = true;
        try {
          const preview = [];
          for (const line of lines) {
            const resp = await apiFetch('/api/parse', { method: 'POST', headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify({ rawMessage: line }) });
            const data = await resp.json();
            preview.push({ rawMessage: line, bank: data.bank, amount: data.amount, merchant: data.merchant, direction: data.direction });
          }
          batchPreview.value = preview; vant.showToast({ type: 'success', message: '解析完成' });
        } catch { vant.showToast({ type: 'fail', message: '解析失败' }); }
        finally { batchParsing.value = false; }
      };

      const doBatchSend = async () => {
        const lines = batchText.value.split('\n').map(l => l.trim()).filter(l => l);
        if (!lines.length) { vant.showToast('请先输入内容'); return; }
        batchSending.value = true; lastStatus.value = '发送中...';
        try {
          const resp = await apiFetch('/api/batch-send', { method: 'POST', headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify(lines.map(l => ({ rawMessage: l }))) });
          const data = await resp.json();
          if (data.ok) { lastStatus.value = '已提交 ' + data.count + ' 条'; vant.showToast({ type: 'success', message: '成功提交 ' + data.count + ' 条' }); }
          else { lastStatus.value = data.msg || '发送失败'; vant.showToast({ type: 'fail', message: data.msg || '发送失败' }); }
        } catch { lastStatus.value = '请求失败'; vant.showToast({ type: 'fail', message: '请求失败' }); }
        finally { batchSending.value = false; }
      };

      const doAiParse = async () => {
        if (!form.rawMessage?.trim()) { vant.showToast('请先输入内容'); return; }
        aiParsing.value = true; parseTip.value = 'AI 解析中...';
        try {
          const resp = await apiFetch('/api/ai-parse', { method: 'POST', headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify({ text: form.rawMessage }) });
          const data = await resp.json();
          if (data.success) {
            if (data.bank) form.bank = data.bank; if (data.cardTail) form.cardTail = data.cardTail;
            if (data.happenTime) form.happenTime = data.happenTime; if (data.direction) form.direction = data.direction;
            if (data.channel) form.channel = data.channel; if (data.merchant) form.merchant = data.merchant;
            if (data.amount != null) form.amount = data.amount; if (data.balance != null) form.balance = data.balance;
            parseTip.value = '解析完成：' + (data.merchant || '未知') + ' ¥' + (data.amount || '?');
          } else { parseTip.value = '解析失败：' + (data.errorMsg || '未知错误'); }
        } catch { parseTip.value = '请求失败'; }
        finally { aiParsing.value = false; }
      };

      const doParse = async () => {
        if (!form.rawMessage?.trim()) { vant.showToast('请先输入内容'); return; }
        parsing.value = true;
        try {
          const resp = await apiFetch('/api/parse', { method: 'POST', headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify({ rawMessage: form.rawMessage }) });
          const data = await resp.json();
          if (data) {
            if (data.bank != null) form.bank = data.bank || ''; if (data.cardTail != null) form.cardTail = data.cardTail || '';
            if (data.happenTime != null) form.happenTime = data.happenTime || ''; if (data.direction != null) form.direction = data.direction || '';
            if (data.channel != null) form.channel = data.channel || ''; if (data.merchant != null) form.merchant = data.merchant || '';
            if (data.amount != null) form.amount = data.amount; if (data.balance != null) form.balance = data.balance;
            parseTip.value = data.tip || '';
          }
        } catch { parseTip.value = '请求失败'; }
        finally { parsing.value = false; }
      };

      const switchRecords = () => { mode.value = 'records'; loadRecords(); };
      const loadRecords = async () => {
        recordsLoading.value = true;
        try { const resp = await apiFetch('/api/records?limit=50'); const data = await resp.json(); if (data.ok) records.value = data.records || []; }
        catch { vant.showToast({ type: 'fail', message: '加载失败' }); }
        finally { recordsLoading.value = false; }
      };

      const deleteRecord = async (id, merchant) => {
        try {
          await vant.showConfirmDialog({ title: '删除记录', message: '确定删除「' + (merchant || '#' + id) + '」？' });
          const resp = await apiFetch('/api/records/' + id, { method: 'DELETE' });
          const data = await resp.json();
          if (data.ok) { vant.showToast({ type: 'success', message: '已删除' }); loadRecords(); }
          else vant.showToast({ type: 'fail', message: data.msg || '删除失败' });
        } catch (e) { if (e !== 'cancel' && e.message !== 'cancel') vant.showToast({ type: 'fail', message: '删除失败' }); }
      };

      const toggleEdit = (id) => {
        if (editingId.value === id) { editingId.value = null; return; }
        const r = records.value.find(x => x.id === id);
        if (r) { Object.assign(editForm, { merchant: r.merchant || '', amount: r.amount || '', direction: r.direction || '', channel: r.channel || '', bank: r.bank || '', balance: r.balance || '' }); editingId.value = id; }
      };

      const saveEdit = async (id) => {
        try {
          const resp = await apiFetch('/api/records/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify({ ...editForm }) });
          const data = await resp.json();
          if (data.ok) { vant.showToast({ type: 'success', message: '已更新' }); editingId.value = null; loadRecords(); }
          else vant.showToast({ type: 'fail', message: data.msg || '更新失败' });
        } catch { vant.showToast({ type: 'fail', message: '更新失败' }); }
      };

      // ===== AI 异步指令 =====
      const doAiCommand = async () => {
        if (!aiCommandInput.value?.trim()) { vant.showToast('请输入指令'); return; }
        aiCommanding.value = true; aiReply.value = '处理中...'; aiReplyError.value = false;
        try {
          const resp = await apiFetch('/api/ai-command-async', { method: 'POST', headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify({ text: aiCommandInput.value }) });
          const data = await resp.json();
          if (data.ok) {
            const taskId = data.taskId;
            const poll = async () => {
              try {
                const r = await apiFetch('/api/ai-command-result?taskId=' + taskId);
                const d = await r.json();
                if (d.status === 'pending') { aiReply.value = '处理中...'; setTimeout(poll, 500); }
                else { aiReply.value = d.reply || '执行完成'; aiReplyError.value = d.status === 'error'; aiCommanding.value = false; if (d.status === 'success') loadRecords(); }
              } catch { aiReply.value = '查询失败'; aiReplyError.value = true; aiCommanding.value = false; }
            };
            poll();
          } else { aiReply.value = '提交失败'; aiReplyError.value = true; aiCommanding.value = false; }
        } catch { aiReply.value = '请求失败'; aiReplyError.value = true; aiCommanding.value = false; }
      };

      const doAiQuery = async () => {
        aiCommanding.value = true; aiReply.value = '查询中...'; aiReplyError.value = false;
        try {
          const resp = await apiFetch('/api/ai-command-async', { method: 'POST', headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify({ text: '查询所有记录' }) });
          const data = await resp.json();
          if (data.ok) {
            const taskId = data.taskId;
            const poll = async () => {
              const r = await apiFetch('/api/ai-command-result?taskId=' + taskId);
              const d = await r.json();
              if (d.status === 'pending') { aiReply.value = '查询中...'; setTimeout(poll, 500); }
              else { aiReply.value = d.reply || '查询完成'; aiReplyError.value = d.status === 'error'; aiCommanding.value = false; loadRecords(); }
            };
            poll();
          } else { aiReply.value = '提交失败'; aiReplyError.value = true; aiCommanding.value = false; }
        } catch { aiReply.value = '请求失败'; aiReplyError.value = true; aiCommanding.value = false; }
      };

      const doSend = async () => {
        const hasRaw = !!(form.rawMessage?.trim());
        const hasField = !!(form.bank || form.cardTail || form.happenTime || form.direction || form.channel || form.merchant || form.amount != null || form.balance != null);
        if (!hasRaw && !hasField) { vant.showToast('请输入内容'); return; }
        sending.value = true; lastStatus.value = '发送中...';
        try {
          const payload = { ...form };
          if (payload.rawMessage && !payload.rawMessage.trim()) payload.rawMessage = null;
          const resp = await apiFetch('/api/send', { method: 'POST', headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify(payload) });
          const data = await resp.json();
          if (data.ok) { lastStatus.value = '已接收，正在异步处理'; vant.showToast({ type: 'success', message: '发送成功' }); }
          else { lastStatus.value = data.msg || '发送失败'; vant.showToast({ type: 'fail', message: data.msg || '发送失败' }); }
        } catch { lastStatus.value = '请求失败'; vant.showToast({ type: 'fail', message: '请求失败' }); }
        finally { sending.value = false; }
      };

      // ===== 统计 =====
      const switchStats = () => { mode.value = 'stats'; loadStats(); };
      const switchStatsRange = (r) => { statsRange.value = r; loadStats(); };

      const loadStats = async () => {
        statsSummary.value = null; statsCompare.value = null;
        const range = statsRange.value;
        try {
          const [sumResp, dailyResp, catResp, cmpResp] = await Promise.all([
            apiFetch('/api/stats/summary?range=' + range).then(r => r.json()),
            apiFetch('/api/stats/daily?range=' + range).then(r => r.json()),
            apiFetch('/api/stats/category?range=' + range).then(r => r.json()),
            apiFetch('/api/stats/compare?range=' + range).then(r => r.json())
          ]);
          statsSummary.value = sumResp;
          statsDaily.value = dailyResp.series || [];
          statsCategory.value = catResp.series || [];
          statsCompare.value = cmpResp;
          nextTick(() => { initTrendChart(); initCategoryChart(); initCompareChart(); });
        } catch (e) { vant.showToast({ type: 'fail', message: '统计加载失败' }); }
      };

      const initTrendChart = () => {
        const el = document.getElementById('chart-trend');
        if (!el) return;
        if (trendChart) trendChart.dispose();
        trendChart = echarts.init(el);
        trendChart.setOption({
          tooltip: { trigger: 'axis' },
          grid: { left: 40, right: 20, top: 20, bottom: 30 },
          xAxis: { type: 'category', data: statsDaily.value.map(d => d.date.substring(5)), axisLabel: { fontSize: 10, rotate: 30 } },
          yAxis: { type: 'value', axisLabel: { fontSize: 10 } },
          series: [
            { name: '支出', type: 'line', smooth: true, data: statsDaily.value.map(d => Number(d.expense) || 0), itemStyle: { color: '#1a1a1a' }, areaStyle: { color: 'rgba(26,26,26,0.08)' } },
            { name: '收入', type: 'line', smooth: true, data: statsDaily.value.map(d => Number(d.income) || 0), itemStyle: { color: '#2d8659' }, areaStyle: { color: 'rgba(45,134,89,0.08)' } }
          ]
        });
      };

      const initCategoryChart = () => {
        const el = document.getElementById('chart-category');
        if (!el) return;
        if (categoryChart) categoryChart.dispose();
        categoryChart = echarts.init(el);
        categoryChart.setOption({
          tooltip: { trigger: 'item', formatter: '{b}: ¥{c} ({d}%)' },
          series: [{
            type: 'pie', radius: ['40%', '70%'], center: ['50%', '50%'],
            label: { fontSize: 11, formatter: '{b}\n¥{c}' },
            data: statsCategory.value.map(c => ({ name: c.name, value: Number(c.value) || 0 }))
          }]
        });
      };

      const initCompareChart = () => {
        const el = document.getElementById('chart-compare');
        if (!el || !statsCompare.value) return;
        if (compareChart) compareChart.dispose();
        compareChart = echarts.init(el);
        const c = statsCompare.value;
        compareChart.setOption({
          tooltip: { trigger: 'axis' },
          legend: { data: ['本期', '上期'], bottom: 0, textStyle: { fontSize: 12 } },
          grid: { left: 40, right: 20, top: 20, bottom: 40 },
          xAxis: { type: 'category', data: ['支出', '收入', '笔数'], axisLabel: { fontSize: 11 } },
          yAxis: { type: 'value', axisLabel: { fontSize: 10 } },
          series: [
            { name: '本期', type: 'bar', data: [Number(c.current.expense) || 0, Number(c.current.income) || 0, c.current.count], itemStyle: { color: '#1a1a1a' }, barWidth: '30%' },
            { name: '上期', type: 'bar', data: [Number(c.previous.expense) || 0, Number(c.previous.income) || 0, c.previous.count], itemStyle: { color: '#ccc' }, barWidth: '30%' }
          ]
        });
      };

      return {
        // 登录态
        token, userInfo, isLoggedIn, loginForm, loginLoading, smsKey,
        doLogin, logout, copySmsKey,
        // 记账
        form, parsing, sending, parseTip, lastStatus, fillSample, resetAll, doParse, doSend,
        mode, batchText, batchParsing, batchSending, batchPreview, fillBatchSample, resetBatch, doBatchParse, doBatchSend,
        aiParsing, doAiParse,
        records, recordsLoading, aiCommandInput, aiReply, aiReplyError, aiCommanding,
        switchRecords, loadRecords, deleteRecord, doAiCommand, doAiQuery,
        editingId, editForm, toggleEdit, saveEdit,
        statsRange, statsSummary, statsCompare, statsDaily, statsCategory,
        switchStats, switchStatsRange, fmt, isUp
      };
    }
  });
  app.use(vant);
  app.mount('#app');
</script>
</body>
</html>
