<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>飞书消息转发助手</title>
<link rel="stylesheet" href="https://unpkg.com/vant@4/lib/index.css" />
<style>
  html, body { margin: 0; padding: 0; background: #f7f8fa; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { max-width: 720px; margin: 0 auto; padding-bottom: 140px; }
  .page-header { padding: 20px 16px 8px; }
  .page-title { font-size: 22px; font-weight: 700; color: #323233; }
  .page-sub   { margin-top: 4px; font-size: 13px; color: #969799; line-height: 1.5; }
  .card-wrap  { padding: 12px 16px 0; }
  .section-title { font-size: 15px; font-weight: 600; color: #323233; margin: 16px 4px 10px; display: flex; align-items: center; }
  .section-title .badge { display:inline-block; width:4px; height:16px; border-radius:2px; background:#1989fa; margin-right:8px;}
  .parse-tip { margin-top: 10px; padding: 8px 10px; background:#fff; border-radius:6px; font-size: 13px; color:#646566; border:1px solid #ebedf0; }
  .sample-btn-row { display:flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items:center; }
  .sample-btn-row .parse-btn { flex: 1 1 100%; }
  @media (min-width: 520px) { .sample-btn-row .parse-btn { flex: 1 1 auto; } }
  .send-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; border-top: 1px solid #ebedf0;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    box-sizing: border-box; z-index: 100;
    max-width: 720px; margin: 0 auto;
    display: flex; gap: 10px; align-items: center;
  }
  .send-bar .status { flex:1; font-size:12px; color:#969799; line-height: 1.4; word-break: break-all; }
  .raw-input { --van-field-input-height: 180px; }
  /* 双列布局：不要包在 van-cell-group 里，否则样式会冲突 */
  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .row > .van-field,
  .single > .van-field {
    border-radius: 8px;
    background: #fff;
    margin-bottom: 10px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    border: 1px solid #ebedf0;
  }
  .single { display: block; margin-bottom: 10px; }
  @media (max-width: 380px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app">
  <div class="page-header">
    <div class="page-title">💬 飞书消息转发助手</div>
    <div class="page-sub">粘贴完整银行短信，可一键解析为结构化字段，确认后推送到飞书群机器人。PC 和手机浏览器通用。</div>
  </div>

  <!-- 方式一：完整短信输入 -->
  <div class="card-wrap">
    <div class="section-title"><span class="badge"></span>方式一 · 粘贴完整消息</div>
    <van-cell-group inset>
      <van-field
        v-model="form.rawMessage"
        class="raw-input"
        rows="8"
        autosize
        type="textarea"
        maxlength="800"
        placeholder="例：尾号xxxx卡8月1日19:48支出(消费抖音支付-xx餐饮集团有限公司)0.01元，余额0.01元。【xx银行】"
        show-word-limit
      ></van-field>
    </van-cell-group>

    <div class="sample-btn-row">
      <van-button size="small" plain type="primary" @click="fillSample">填入支出样例</van-button>
      <van-button size="small" plain type="info" @click="fillSample2">填入收入样例</van-button>
      <van-button class="parse-btn" size="small" type="success" @click="doParse" :loading="parsing">🔍 解析到下方字段</van-button>
    </div>

    <div v-if="parseTip" class="parse-tip">
      <van-tag :type="parseSuccess ? 'success' : 'warning'">{{ parseSuccess ? '解析完成' : '提示' }}</van-tag>
      <span style="margin-left:6px;">{{ parseTip }}</span>
    </div>
  </div>

  <!-- 方式二：拆分字段（不套 van-cell-group，用自定义 row/single card 布局，避免双列时 van-cell-group 边框异常） -->
  <div class="card-wrap">
    <div class="section-title"><span class="badge"></span>方式二 · 逐项填写（方式一解析后会自动填充，也可以手动改）</div>

    <div class="row">
      <van-field v-model="form.bank" label="银行" placeholder="xx银行" clearable></van-field>
      <van-field v-model="form.cardTail" label="尾号" placeholder="xxxx" maxlength="4" clearable></van-field>
    </div>

    <div class="single">
      <van-field v-model="form.happenTime" label="时间" placeholder="2026-08-01 19:48" clearable>
        <template #button>
          <van-icon name="clock-o" size="18" @click="fillNow"></van-icon>
        </template>
      </van-field>
    </div>

    <div class="row">
      <van-field v-model="form.direction" label="收支" is-link readonly placeholder="请选择" @click="showDir = true"></van-field>
      <van-field v-model="form.channel" label="渠道" placeholder="抖音支付 / 支付宝 / 微信" clearable></van-field>
    </div>

    <div class="single">
      <van-field v-model="form.merchant" label="商家" placeholder="xx集团有限公司" clearable></van-field>
    </div>

    <div class="row">
      <van-field v-model="form.amount" label="金额(元)" placeholder="0.01" clearable input-align="right"></van-field>
      <van-field v-model="form.balance" label="余额(元)" placeholder="0.01" clearable input-align="right"></van-field>
    </div>
  </div>

  <!-- 底部发送栏 -->
  <div class="send-bar">
    <div class="status" v-if="lastStatus">{{ lastStatus }}</div>
    <van-button type="default" @click="resetAll">重置</van-button>
    <van-button type="primary" block @click="doSend" :loading="sending">📤 发送到飞书</van-button>
  </div>

  <!-- 方向选择 -->
  <van-popup v-model:show="showDir" position="bottom" round>
    <van-picker
      :columns="dirOptions"
      title="选择收支方向"
      @confirm="onDirConfirm"
      @cancel="showDir = false"
    ></van-picker>
  </van-popup>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/vant@4/lib/vant.min.js"></script>
<script>
  const { createApp, reactive, ref } = Vue;

  const app = createApp({
    setup() {
      const EMPTY_FORM = () => ({
        rawMessage: '',
        bank: '',
        cardTail: '',
        happenTime: '',
        direction: '',
        channel: '',
        merchant: '',
        amount: null,
        balance: null,
      });
      const form = reactive(EMPTY_FORM());

      const parsing = ref(false);
      const sending = ref(false);
      const parseTip = ref('');
      const parseSuccess = ref(false);
      const lastStatus = ref('');
      const showDir = ref(false);
      const dirOptions = [
        { text: '支出', value: '支出' },
        { text: '收入', value: '收入' },
      ];

      const onDirConfirm = ({ selectedOptions }) => {
        form.direction = selectedOptions[0].value;
        showDir.value = false;
      };

      const fillNow = () => {
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        form.happenTime = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      };

      const fillSample = () => {
        form.rawMessage = '尾号xxxx卡8月1日19:48支出(消费抖音支付-xxx餐饮集团有限公司)1.00元，余额0.01元。【xx银行】';
      };
      const fillSample2 = () => {
        form.rawMessage = '您尾号xxxx的储蓄卡8月1日10:00入账工资人民币1.00元，余额1.00元。【xx银行】';
      };

      const resetAll = () => {
        Object.assign(form, EMPTY_FORM());
        parseTip.value = '';
        parseSuccess.value = false;
        lastStatus.value = '';
      };

      const doParse = async () => {
        if (!form.rawMessage || !form.rawMessage.trim()) {
          vant.showToast('请先粘贴完整的短信内容');
          return;
        }
        parsing.value = true;
        try {
          const resp = await fetch('/api/parse', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=utf-8' },
            body: JSON.stringify({ rawMessage: form.rawMessage })
          });
          const data = await resp.json();
          if (data) {
            if (data.bank     !== undefined && data.bank     !== null) form.bank      = data.bank      || '';
            if (data.cardTail !== undefined && data.cardTail !== null) form.cardTail  = data.cardTail  || '';
            if (data.happenTime !== undefined && data.happenTime !== null) form.happenTime = data.happenTime || '';
            if (data.direction !== undefined && data.direction !== null) form.direction = data.direction || '';
            if (data.channel  !== undefined && data.channel  !== null) form.channel   = data.channel   || '';
            if (data.merchant !== undefined && data.merchant !== null) form.merchant  = data.merchant  || '';
            if (data.amount   !== undefined && data.amount   !== null) form.amount    = data.amount;
            if (data.balance  !== undefined && data.balance  !== null) form.balance   = data.balance;
            parseTip.value      = data.tip || '';
            parseSuccess.value = !!data.success;
            vant.showToast({ type: parseSuccess.value ? 'success' : 'fail', message: parseSuccess.value ? '解析完成' : '解析异常' });
          }
        } catch (e) {
          console.error(e);
          vant.showToast({ type: 'fail', message: '解析请求失败：' + (e.message || e) });
          parseTip.value = '请求失败，请检查后端是否启动在同源端口下';
          parseSuccess.value = false;
        } finally {
          parsing.value = false;
        }
      };

      const doSend = async () => {
        const hasRaw = !!(form.rawMessage && form.rawMessage.trim());
        const hasAnyField = !!(
          form.bank || form.cardTail || form.happenTime || form.direction ||
          form.channel || form.merchant || form.amount != null || form.balance != null
        );
        if (!hasRaw && !hasAnyField) {
          vant.showToast('请先粘贴完整短信或填写至少一项字段');
          return;
        }
        sending.value = true;
        lastStatus.value = '发送中...';
        try {
          const payload = { ...form };
          if (payload.rawMessage && !payload.rawMessage.trim()) payload.rawMessage = null;

          const resp = await fetch('/api/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=utf-8' },
            body: JSON.stringify(payload)
          });
          const data = await resp.json();

          // ① 解析群消息结果
          let feishuOk = false, feishuMsg = '';
          try {
            const fs = typeof data.feishu === 'string' ? JSON.parse(data.feishu) : data.feishu;
            feishuOk = fs && (fs.StatusCode === 0 || fs.code === 0);
            feishuMsg = (fs && (fs.StatusMessage || fs.msg)) || '';
          } catch (_) { feishuMsg = String(data.feishu || ''); }

          // ② 解析多维表格结果
          let tableOk = false, tableMsg = '';
          if (data.bitable) {
            try {
              const bt = typeof data.bitable === 'string' ? JSON.parse(data.bitable) : data.bitable;
              tableOk = bt && bt.code === 0;
              tableMsg = tableOk ? '已写入' : ((bt && bt.msg) || '失败');
            } catch (_) { tableMsg = String(data.bitable || ''); }
          }

          // ③ 组装状态文字
          const parts = [];
          parts.push(feishuOk ? '✅ 群消息已发送' : '⚠️ 群消息：' + (feishuMsg || '失败'));
          if (data.bitable) {
            parts.push(tableOk ? '✅ 表格已写入' : '⚠️ 表格：' + (tableMsg || '失败'));
          }
          lastStatus.value = parts.join('  |  ');

          const allOk = feishuOk && (!data.bitable || tableOk);
          if (allOk) {
            vant.showToast({ type: 'success', message: '发送成功' });
          } else if (feishuOk || tableOk) {
            vant.showToast({ type: 'fail', message: '部分成功，查看状态栏' });
          } else {
            vant.showToast({ type: 'fail', message: '发送失败' });
          }
        } catch (e) {
          console.error(e);
          vant.showToast({ type: 'fail', message: '请求失败' });
          lastStatus.value = '❌ 发送失败：' + (e.message || e);
        } finally {
          sending.value = false;
        }
      };

      return {
        form, parsing, sending, parseTip, parseSuccess, lastStatus,
        showDir, dirOptions, onDirConfirm,
        fillNow, fillSample, fillSample2, resetAll, doParse, doSend,
      };
    }
  });

  app.use(vant);
  app.mount('#app');
</script>
</body>
</html>
